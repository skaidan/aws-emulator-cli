name: Release

# Creates the tag vX.Y.Z and a GitHub release (with wheel and sdist) when CI
# passes on main and pyproject.toml has a version that hasn't been released yet.
# Release notes come from the matching section of CHANGELOG.md.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write      # Sigstore: sign the build provenance with the workflow's identity
  attestations: write  # store the attestations with the repository

jobs:
  release:
    # Only after a green CI (including the tests against the real emulator).
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ env.RELEASE_SHA }}
          fetch-depth: 0

      - name: Read version
        id: version
        run: |
          VERSION=$(python3 -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v$VERSION" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "v$VERSION is already released."
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Release notes from CHANGELOG.md
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          python3 - <<'EOF'
          import os, re, sys
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          match = re.search(rf"^## {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not match:
              sys.exit(f"CHANGELOG.md has no section for {version}")
          open("notes.md", "w", encoding="utf-8").write(match.group(1).strip() + "\n")
          EOF

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        if: steps.version.outputs.exists == 'false'
        with:
          python-version: "3.12"

      - name: Build
        if: steps.version.outputs.exists == 'false'
        run: |
          pip install build
          python -m build

      - name: SBOM (CycloneDX) of the package and its dependencies
        if: steps.version.outputs.exists == 'false'
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          bash scripts/sbom.sh "dist/aws_emulator_cli-$VERSION.cdx.json"

      - name: Signed build provenance (Sigstore, GitHub attestations)
        if: steps.version.outputs.exists == 'false'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: "dist/*.whl, dist/*.tar.gz"

      - name: Checksums
        if: steps.version.outputs.exists == 'false'
        run: cd dist && sha256sum * > SHA256SUMS

      - name: Create release
        if: steps.version.outputs.exists == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          gh release create "v$VERSION" dist/* \
            --target "$RELEASE_SHA" \
            --title "v$VERSION" \
            --notes-file notes.md
