name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    name: tests (${{ matrix.os }}, py${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev,ui]"
      - run: pytest -q
        if: matrix.os != 'ubuntu-latest' || matrix.python != '3.13'
      - name: Tests with coverage
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: pytest -q --cov --cov-report=term-missing:skip-covered --cov-report=xml
      - name: Command reference and JSON Schemas are up to date
        run: |
          python scripts/gen_reference.py --check
          python scripts/gen_schemas.py --check
      - run: awsemu --help
      - run: awsemu doctor
        continue-on-error: true

  oldest-emulator:
    name: the oldest supported AWS Emulator
    runs-on: ubuntu-latest
    env:
      EMULATOR_TELEMETRY: "off"
      AWSEMU_PLAIN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"
      - name: Install the oldest release awsemu supports (updates.MIN_EMULATOR)
        run: |
          MIN=$(python -c "from awsemu.updates import MIN_EMULATOR; print(MIN_EMULATOR)")
          awsemu install "$MIN" --yes
          INSTALLED=$(awsemu install --list --json | python -c "import json, sys; print(json.load(sys.stdin)['installed'])")
          test "$INSTALLED" = "$MIN" || { echo "installed $INSTALLED, wanted $MIN"; exit 1; }
      - name: What awsemu does itself, against it
        run: >
          AWSEMU_REAL_TESTS=1 pytest -m real -v -k "status_and_files or startup_line or whoami
          or s3_roundtrip or sqs_roundtrip or dynamodb_roundtrip or overview_reports or exec_environment
          or restart_resets or random_port or proxy_against or auth_off or seed_apply_is_idempotent
          or json_listings or call_any_operation"
        env:
          GITHUB_TOKEN: ${{ github.token }}

  lint:
    name: lint, format and types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,ui,testcontainers]" "ruff==0.16.9" "mypy==2.3.1"
      - run: ruff check src tests scripts
      - run: ruff format --check src tests scripts
      - run: mypy
      - name: Package and SBOM build (as the release does)
        run: |
          pip install build
          python -m build
          bash scripts/sbom.sh sbom.cdx.json
          python -c "import json; d = json.load(open('sbom.cdx.json')); names = {c['name'] for c in d['components']}; assert {'boto3', 'click'} <= names and 'cyclonedx-bom' not in names, names; print(len(names), 'components')"

  real-emulator:
    name: against the real AWS Emulator
    runs-on: ubuntu-latest
    env:
      EMULATOR_TELEMETRY: "off"
      PKG_BASE: https://downloads.aws.com/aws-emulator/packages/aws-emulator/LTS/latest
      PKG_FILE: aws-emulator_amd64.deb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"

      - name: Download and verify the AWS Emulator package
        run: |
          curl -fsSLO "$PKG_BASE/$PKG_FILE"
          curl -fsSLO "$PKG_BASE/$PKG_FILE.sig"
          curl -fsSLo aws-publishing.asc https://downloads.aws.com/keys/gpg/current.asc
          gpg --import aws-publishing.asc
          FPR=$(gpg --with-colons --fingerprint ssm-publishing@amazon.com | awk -F: '/^fpr/ {print $10; exit}')
          test "$FPR" = "98BCF336A3BE53B734E967C52E5BF49BD940F624" || { echo "unexpected key fingerprint: $FPR"; exit 1; }
          gpg --verify "$PKG_FILE.sig" "$PKG_FILE"

      - name: Install AWS Emulator
        run: |
          sudo apt-get install -y "./$PKG_FILE"
          aws-emulator -v

      - run: pip install -e ".[dev,ui]"
      - run: awsemu doctor
        continue-on-error: true
      - name: Integration tests
        run: AWSEMU_REAL_TESTS=1 pytest -m real -v -s
        env:
          GITHUB_TOKEN: ${{ github.token }}  # the fidelity and issues tests read GitHub's API
      - name: AWS's fidelity tests, run here (fidelity run)
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          pip install uv
          awsemu fidelity run --json \
            --test dynamodb.update-item-set-list-preserves-element-order \
            --test sqs.add-remove-permission > run.json || true
          cat run.json
          python3 -c "
          import json; d = json.load(open('run.json'))
          assert len(d['tests']) == 2, d
          assert all(t['verdict'] in ('passed', 'failed') and t['kind'] != 'runner' for t in d['tests']), d
          print('verdicts:', [(t['test'], t['verdict'], t['published']) for t in d['tests']])"

  languages:
    name: ${{ matrix.tool }} against the real AWS Emulator
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        tool: [node, java, go, terraform, cdk]
    env:
      AWSEMU_PLAIN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - if: matrix.tool == 'node' || matrix.tool == 'cdk'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - if: matrix.tool == 'java'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
      - if: matrix.tool == 'go'
        uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff  # v5.6.0
        with:
          go-version: "1.23"
          cache: false
      - if: matrix.tool == 'terraform'
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e  # v4.0.1
        with:
          terraform_wrapper: false
      - name: Start the emulator (the GitHub Action of this repository)
        uses: ./
        with:
          export-env: "false"

      - name: AWS SDK for JavaScript v3
        if: matrix.tool == 'node'
        working-directory: examples/sdks/node
        run: |
          npm install --no-audit --no-fund
          awsemu exec --sdk node -- node smoke.mjs
          awsemu s3 ls node-example | grep hello.txt

      - name: AWS SDK for Java v2
        if: matrix.tool == 'java'
        working-directory: examples/sdks/java
        run: |
          # Maven downloads everything inside awsemu exec: --sdk java trusts the emulator
          # on top of the JDK's certificates, not instead of them.
          awsemu exec --sdk java -- mvn -q -B compile exec:java
          awsemu s3 ls java-example | grep hello.txt

      - name: AWS SDK for Go v2
        if: matrix.tool == 'go'
        working-directory: examples/sdks/go
        run: |
          go mod tidy
          awsemu exec -- go run .
          awsemu s3 ls go-example | grep hello.txt

      - name: Terraform
        if: matrix.tool == 'terraform'
        working-directory: examples/terraform
        run: |
          terraform init -input=false
          awsemu exec -- terraform apply -auto-approve -input=false
          awsemu sqs ls | grep tf-example-jobs
          awsemu ddb ls | grep tf-example-orders
          awsemu ssm get /tf-example/queue-url | grep tf-example-jobs
          awsemu exec -- terraform plan -detailed-exitcode -input=false   # 0 = no changes left
          awsemu exec -- terraform destroy -auto-approve -input=false
          ! awsemu sqs ls | grep tf-example-jobs

      - name: AWS CDK
        if: matrix.tool == 'cdk'
        working-directory: examples/cdk
        run: |
          npm install --no-audit --no-fund
          awsemu exec --sdk node -- npx cdk deploy --require-approval never
          awsemu sqs ls | grep cdk-example-jobs
          awsemu ddb ls | grep cdk-example-orders
          awsemu ssm get /cdk-example/queue-url | grep cdk-example-jobs
          awsemu exec --sdk node -- npx cdk destroy --force
          ! awsemu ddb ls | grep cdk-example-orders

      - if: always()
        run: awsemu logs -n 80 || true

  docker:
    name: Docker mode and compose (real emulator)
    runs-on: ubuntu-latest
    env:
      EMULATOR_TELEMETRY: "off"
      AWSEMU_PLAIN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - run: pip install -e .

      - name: awsemu image build
        run: awsemu image build

      - name: awsemu start --docker
        run: |
          awsemu --port 9301 start --docker --wait 90
          awsemu --port 9301 status
          awsemu --port 9301 whoami
          awsemu --port 9301 s3 mb docker-mode
          awsemu --port 9301 s3 ls | grep docker-mode
          awsemu --port 9301 logs -n 5 | grep "emulator server information"
          awsemu --port 9301 stop
          if awsemu --port 9301 status; then echo 'still running after stop'; exit 1; fi
          awsemu --port 9301 logs -n 200 | grep "emulator server information"   # log kept after stop

      - name: awsemu compose
        run: |
          awsemu --port 9302 compose -o compose.emulator.yaml --no-telemetry
          cat compose.emulator.yaml
          docker compose -f compose.emulator.yaml up -d
          for i in $(seq 60); do awsemu --port 9302 status >/dev/null && break; sleep 1; done
          awsemu --port 9302 status
          awsemu --port 9302 whoami
          awsemu --port 9302 exec -- python -c "import boto3; boto3.client('sqs').create_queue(QueueName='from-compose')"
          awsemu --port 9302 sqs ls | grep from-compose

      - name: App containers through the proxy (compose --proxy, proxy --host 0.0.0.0)
        run: |
          awsemu --port 9302 compose --proxy --no-build -o compose.proxy.yaml --no-telemetry
          printf '  app:\n    image: amazon/aws-cli:latest\n    <<: *aws-emulator-client\n' >> compose.proxy.yaml
          cat compose.proxy.yaml
          awsemu --port 9302 proxy start -d --host 0.0.0.0 --bodies
          docker compose -f compose.proxy.yaml run --rm app s3api create-bucket --bucket via-proxy
          docker compose -f compose.proxy.yaml run --rm app sqs create-queue --queue-name via-proxy
          awsemu --port 9302 s3 ls | grep via-proxy
          awsemu --port 9302 proxy calls --json | grep -q '"operation": "CreateBucket"'
          awsemu --port 9302 proxy calls --json | grep -q 'host.docker.internal'
          awsemu --port 9302 proxy har -o calls.har && grep -q CreateQueue calls.har
          awsemu --port 9302 check --from-calls --no-explain
          ! docker compose -f compose.proxy.yaml run --rm app sqs get-queue-url --queue-name does-not-exist
          awsemu --port 9302 report last | tee report.md
          grep -q "## Steps to reproduce" report.md && grep -q "GetQueueUrl" report.md
          ! grep -qi "authorization" report.md
          awsemu --port 9302 proxy stop
          docker compose -f compose.emulator.yaml down

  testcontainers:
    name: Testcontainers module, ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: [python, java, node]
    env:
      EMULATOR_TELEMETRY: "off"
      AWSEMU_PLAIN: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - if: matrix.language == 'java'
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3  # v4.9.1
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: testcontainers/java/pom.xml
      - if: matrix.language == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: "22"
      - run: pip install -e ".[dev,testcontainers]"
      - name: The image (awsemu image build)
        run: awsemu image build
      - name: Python
        if: matrix.language == 'python'
        run: AWSEMU_TESTCONTAINERS=1 pytest tests/test_containers.py -v
      - name: Java
        if: matrix.language == 'java'
        working-directory: testcontainers/java
        run: mvn -q -B test || (sleep 90 && mvn -q -B test)   # Maven Central answers 429 at times
      - name: Node
        if: matrix.language == 'node'
        working-directory: testcontainers/node
        run: |
          npm install --no-audit --no-fund
          npm test

  action:
    name: GitHub Action (uses ./)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up AWS Emulator with the example seed
        id: emu
        uses: ./
        with:
          seed: examples/seed.yaml
          port: "9303"
      - name: Following steps talk to the emulator with no extra setup
        env:
          ENDPOINT: ${{ steps.emu.outputs.endpoint-url }}
        run: |
          test "$ENDPOINT" = "https://127.0.0.1:9303"
          test "$AWS_ENDPOINT_URL" = "$ENDPOINT"
          aws sts get-caller-identity --query Account --output text | grep -x 000000000000
          aws s3 ls | grep shop-assets
          python3 -c "import boto3; t = boto3.client('dynamodb').scan(TableName='customers')['Count']; assert t == 2, t"
          awsemu status
          awsemu overview
      - if: always()
        run: awsemu logs -n 50 || true
      - if: always()
        run: awsemu stop
      - name: The action installs a pinned version (the same one, by number)
        id: pinned
        uses: ./
        with:
          emulator-version: ${{ steps.emu.outputs.emulator-version }}
          port: "9304"
      - name: Versions, install --pin and check against the real data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          WANT: ${{ steps.emu.outputs.emulator-version }}
        run: |
          set -x
          test -n "$WANT"
          test "${{ steps.pinned.outputs.emulator-version }}" = "$WANT"
          awsemu stop
          awsemu install --list | head -5
          awsemu install --list --json | python3 -c "import json,sys; d=json.load(sys.stdin); assert d['installed'] == '$WANT', d"
          mkdir -p /tmp/proj && cd /tmp/proj
          awsemu install "$WANT" --pin --yes
          grep -x "emulator_version = \"$WANT\"" awsemu.toml
          awsemu doctor --json | python3 -c "import json,sys; c={x['check']: x for x in json.load(sys.stdin)['checks']}; assert c['emulator version']['result'] == 'ok', c"
          awsemu check "$GITHUB_WORKSPACE/examples/check-demo"
          awsemu check "$GITHUB_WORKSPACE/examples/check-demo" --json | python3 -c "import json,sys; d=json.load(sys.stdin); ops={o['operation'] for o in d['operations']}; assert {'dynamodb:TransactWriteItems','dynamodb:GetItem','sqs:SendMessage'} <= ops, ops"
          cd "$GITHUB_WORKSPACE/examples/check-demo" && awsemu fidelity --mine
      - name: Emulator issues and explanations, with the real files
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -x
          awsemu issues dynamodb -n 5
          awsemu issues dynamodb --json -n 5 | python3 -c "import json,sys; d=json.load(sys.stdin); assert d and all(i['severity'] and i['title'] and i['state'] == 'open' for i in d), d"
          awsemu issues --show 1 | head -20
          awsemu check examples/check-demo --release 1.0.385 --all
          awsemu check examples/check-demo --release 1.0.385 --json | python3 -c "import json,sys; s=json.load(sys.stdin)['summary']; print(s); assert s['explained_by_issues'] is not None and s['latest'] and s['fixed_in_latest'] is not None, s"
          awsemu issues sqs --fixed --release 1.0.385 -n 5
