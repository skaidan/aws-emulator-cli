name: Translate release notes (one-off)

# Rewrites the notes of the releases published before English became the
# project's language, from the (now English) CHANGELOG.md. Deleted after it runs.

on:
  push:
    branches: [main]
    paths: [.github/workflows/translate-release-notes.yml]

permissions:
  contents: write

jobs:
  notes:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite notes of v0.2.0 to v0.6.0
        run: |
          for v in 0.2.0 0.3.0 0.4.0 0.5.0 0.6.0; do
            VERSION=$v python3 - <<'EOF'
          import os, re, sys
          version = os.environ["VERSION"]
          text = open("CHANGELOG.md", encoding="utf-8").read()
          m = re.search(rf"^## {re.escape(version)}\b.*?$(.*?)(?=^## |\Z)", text, re.M | re.S)
          if not m:
              sys.exit(f"no CHANGELOG section for {version}")
          open("notes.md", "w", encoding="utf-8").write(m.group(1).strip() + "\n")
          EOF
            gh release edit "v$v" --notes-file notes.md
            echo "v$v: $(head -1 notes.md)"
          done
