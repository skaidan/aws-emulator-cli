# Dependency updates: one pull request a week per ecosystem, minor and patch
# versions grouped; major versions get their own pull request, to review on its own.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      python-minor:
        update-types: [minor, patch]
    labels: [dependencies]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    groups:
      actions-minor:
        update-types: [minor, patch]
    labels: [dependencies, ci]

  - package-ecosystem: npm
    directory: /testcontainers/node
    schedule:
      interval: weekly
      day: monday
    groups:
      node-minor:
        update-types: [minor, patch]
    labels: [dependencies, testcontainers]

  - package-ecosystem: maven
    directory: /testcontainers/java
    schedule:
      interval: weekly
      day: monday
    groups:
      java-minor:
        update-types: [minor, patch]
    labels: [dependencies, testcontainers]
