[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aws-emulator-cli"
version = "0.8.0"
description = "A friendly CLI for AWS Emulator: start/stop it, wire your shell to it and browse what's inside."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "skaidan" }]
keywords = ["aws", "emulator", "cli", "local", "testing", "s3", "sqs", "dynamodb"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "click>=8.1",
  "rich>=13.0",
  "boto3>=1.34",
  "pyyaml>=6.0",
  "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "cryptography>=42"]
ui = ["textual>=0.80"]

[project.scripts]
awsemu = "awsemu.cli:main"

[project.entry-points.pytest11]
awsemu = "awsemu.pytest_plugin"

[project.urls]
Homepage = "https://github.com/skaidan/aws-emulator-cli"
"AWS Emulator" = "https://github.com/aws/aws-emulator"

[tool.hatch.build.targets.wheel]
packages = ["src/awsemu"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real: runs against the real aws-emulator (set AWSEMU_REAL_TESTS=1)"]
