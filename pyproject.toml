[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "aws-emulator-cli"
version = "0.14.0"
description = "A friendly CLI for AWS Emulator: start/stop it, wire your shell to it and browse what's inside."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "skaidan" }]
keywords = ["aws", "emulator", "cli", "local", "testing", "s3", "sqs", "dynamodb"]
classifiers = [
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Software Development :: Testing",
]
dependencies = [
  "click>=8.1",
  "rich>=13.0",
  "boto3>=1.34",
  "pyyaml>=6.0",
  "cryptography>=42",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5", "jsonschema>=4.18"]
ui = ["textual>=0.80"]
testcontainers = ["testcontainers>=4.8"]

[project.scripts]
awsemu = "awsemu.cli:main"

[project.entry-points.pytest11]
awsemu = "awsemu.pytest_plugin"

[project.urls]
Homepage = "https://github.com/skaidan/aws-emulator-cli"
"AWS Emulator" = "https://github.com/aws/aws-emulator"

[tool.hatch.build.targets.wheel]
packages = ["src/awsemu"]

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["examples", "testcontainers"]

[tool.ruff.lint]
# Bugs and modern Python, not style: imports inside functions are deliberate (fast startup).
select = ["E", "F", "W", "B", "UP", "C4", "SIM", "PIE", "RUF100"]
ignore = [
  "SIM105",  # contextlib.suppress is not clearer than try/except/pass
  "SIM108",  # a ternary is not always clearer
  "SIM117",  # nested with blocks read fine
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "SIM300", "C408"]

[tool.ruff.format]
# defaults: double quotes, spaces

[tool.mypy]
python_version = "3.11"
files = ["src/awsemu"]
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true

[tool.coverage.run]
source = ["awsemu"]
branch = true

[tool.coverage.report]
skip_empty = true
fail_under = 65  # measured 69% (branches included) without the real-emulator tests
exclude_also = ["if TYPE_CHECKING:", "raise AssertionError", "pragma: no cover"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = ["real: runs against the real aws-emulator (set AWSEMU_REAL_TESTS=1)"]

# Architecture rules, checked by `lint-imports` (CONTRIBUTING.md). The ignore_imports
# lists are today's exceptions, to remove as ROADMAP v0.14 "Layers" moves the code;
# a new exception needs a reason in review.
[tool.importlinter]
root_packages = ["awsemu"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Only the presentation layer imports Click, Rich and the commands"
type = "protected"
protected_modules = ["click", "rich", "awsemu.cli", "awsemu.commands", "awsemu.context", "awsemu.ui", "awsemu.tui"]
allowed_importers = [
    "awsemu.__main__",
    "awsemu.cli",
    "awsemu.commands",
    "awsemu.completion",
    "awsemu.context",
    "awsemu.deprecation",
    "awsemu.tui",
    "awsemu.ui",
]
ignore_imports = [
    "awsemu.browse -> awsemu.commands.overview",
    "awsemu.pytest_plugin -> awsemu.commands.seed",
    "awsemu.services.* -> awsemu.commands._common",
    "awsemu.services.dynamodb -> awsemu.commands.dynamodb",
    "awsemu.services.lambda_ -> awsemu.commands.lambda_",
    "awsemu.services.sns -> awsemu.commands.sns",
    "awsemu.services.stepfunctions -> awsemu.commands.sfn",
]

[[tool.importlinter.contracts]]
name = "Commands don't import each other (shared code goes in _common or the core)"
type = "independence"
modules = ["awsemu.commands.*"]
ignore_imports = [
    "awsemu.** -> awsemu.commands._common",
    # the core's exceptions from the contract above, which also link commands through the core:
    "awsemu.browse -> awsemu.commands.overview",
    "awsemu.pytest_plugin -> awsemu.commands.seed",
    "awsemu.services.dynamodb -> awsemu.commands.dynamodb",
    "awsemu.services.lambda_ -> awsemu.commands.lambda_",
    "awsemu.services.sns -> awsemu.commands.sns",
    "awsemu.services.stepfunctions -> awsemu.commands.sfn",
    # commands importing commands:
    "awsemu.commands.check -> awsemu.commands.fidelity",
    "awsemu.commands.check -> awsemu.commands.iam",
    "awsemu.commands.check -> awsemu.commands.proxy",
    "awsemu.commands.compose -> awsemu.commands.proxy",
    "awsemu.commands.doctor -> awsemu.commands.lifecycle",
    "awsemu.commands.events -> awsemu.commands.sns",
    "awsemu.commands.explain -> awsemu.commands.check",
    "awsemu.commands.explain -> awsemu.commands.proxy",
    "awsemu.commands.iam -> awsemu.commands.proxy",
    "awsemu.commands.issues -> awsemu.commands.fidelity",
    "awsemu.commands.lifecycle -> awsemu.commands.proxy",
    "awsemu.commands.lifecycle -> awsemu.commands.seed",
    "awsemu.commands.proxy -> awsemu.commands.iam",
    "awsemu.commands.report -> awsemu.commands.proxy",
    "awsemu.commands.snapshot -> awsemu.commands.lifecycle",
    "awsemu.commands.snapshot -> awsemu.commands.seed",
    "awsemu.commands.ui -> awsemu.commands.env",
    "awsemu.commands.watch -> awsemu.commands.proxy",
]
